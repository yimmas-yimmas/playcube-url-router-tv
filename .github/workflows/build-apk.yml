name: Build TV and Samsung APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both APKs
        run: gradle :receiver_app:assembleDebug :phone-sender-app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tvbox-receiver-apk
          path: receiver_app/build/outputs/apk/debug/receiver_app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: send-to-playcube-samsung-apk
          path: phone-sender-app/build/outputs/apk/debug/phone-sender-app-debug.apk
