name: Build TV and Samsung APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare persistent app-signing key
        shell: bash
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
          TVBOX_SIGNING_PASSWORD: ${{ secrets.TVBOX_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TVBOX_KEYSTORE_BASE64" || -z "$TVBOX_SIGNING_PASSWORD" ]]; then
            echo "::error::Set repository secrets TVBOX_KEYSTORE_BASE64 and TVBOX_SIGNING_PASSWORD before running the build."
            exit 1
          fi
          # Tolerate line breaks from copy/pasting the Base64 text and print
          # actionable validation failures without revealing signing secrets.
          python3 - <<'PY'
          import base64, binascii, os, pathlib, sys
          value = ''.join(os.environ['TVBOX_KEYSTORE_BASE64'].split())
          try:
              decoded = base64.b64decode(value, validate=True)
          except (binascii.Error, ValueError):
              print('::error title=Invalid signing key::TVBOX_KEYSTORE_BASE64 is not valid Base64. Copy the text inside keystore-base64.txt, not the ZIP file or its name.')
              sys.exit(1)
          if len(decoded) < 512 or decoded[0] != 0x30:
              print('::error title=Invalid signing key::Decoded keystore is not a valid-looking PKCS12 file. Recopy keystore-base64.txt.')
              sys.exit(1)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tvbox-signing.p12'
          path.write_bytes(decoded)
          print('PKCS12 signing key decoded successfully.')
          PY
          chmod 600 "$RUNNER_TEMP/tvbox-signing.p12"
          # The provided password text file ends with a newline. Strip accidental
          # leading/trailing whitespace when checking, as Gradle does below.
          cleaned_password="$(python3 -c 'import os;print(os.environ["TVBOX_SIGNING_PASSWORD"].strip(),end="")')"
          if ! keytool -list -keystore "$RUNNER_TEMP/tvbox-signing.p12" -storetype PKCS12 -storepass "$cleaned_password" > /dev/null 2>&1; then
            echo "::error title=Incorrect keystore password::Decoded keystore could not be opened. Replace TVBOX_SIGNING_PASSWORD with the contents of signing-password.txt, not the Base64 text."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/tvbox-signing.p12" -storetype PKCS12 -storepass "$cleaned_password" -alias tvbox-signing > /dev/null 2>&1; then
            echo "::error title=Incorrect keystore alias::The PKCS12 key does not contain the expected tvbox-signing alias. Recopy the correct keystore-base64.txt."
            exit 1
          fi
          echo "PKCS12 password and signing alias verified."
          echo "TVBOX_KEYSTORE_FILE=$RUNNER_TEMP/tvbox-signing.p12" >> "$GITHUB_ENV"
      - name: Build both APKs with stable signing
        env:
          TVBOX_SIGNING_PASSWORD: ${{ secrets.TVBOX_SIGNING_PASSWORD }}
        run: gradle :receiver_app:assembleDebug :phone-sender-app:assembleDebug --stacktrace
      - name: Verify both APK signatures
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          tv_apk="receiver_app/build/outputs/apk/debug/receiver_app-debug.apk"
          phone_apk="phone-sender-app/build/outputs/apk/debug/phone-sender-app-debug.apk"
          "$signer" verify --verbose "$tv_apk"
          "$signer" verify --verbose "$phone_apk"
          tv_cert=$("$signer" verify --print-certs "$tv_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          phone_cert=$("$signer" verify --print-certs "$phone_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [[ -z "$tv_cert" || "$tv_cert" != "$phone_cert" ]]; then
            echo "::error::TV and phone APKs do not use the same persistent signing certificate."
            exit 1
          fi
          echo "Both APKs signed with certificate SHA-256: $tv_cert"
      - uses: actions/upload-artifact@v4
        with:
          name: tvbox-receiver-apk
          path: receiver_app/build/outputs/apk/debug/receiver_app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: send-to-playcube-samsung-apk
          path: phone-sender-app/build/outputs/apk/debug/phone-sender-app-debug.apk
      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/tvbox-signing.p12"
